
services:
  postgresdb:
    image: postgres:16-alpine
    container_name: hackathon-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: curd_2400032500
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - springboot-postgres-net

  backend:
    image: sreeja9090/docker-backend-2400032500:latest
    container_name: hackathon-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/curd_2400032500
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - postgresdb
    restart: on-failure
    networks:
      - springboot-postgres-net

  frontend:
    image: sreeja9090/docker-frontend-2400032500:latest
    container_name: hackathon-frontend
    ports:
      - "5176:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - springboot-postgres-net

volumes:
  postgres_data:

networks:
  springboot-postgres-net:
